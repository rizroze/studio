    <!-- One 1000x1000 card for every surface (the benji.org approach).
         Chats show the full square. X crops it to 2:1, keeping y 250-750, so
         the mark is drawn at 38% of the canvas (382px, y 309-690) to clear
         that crop with ~60px of margin. Shrinking the mark is what makes one
         file work everywhere, so keep that ratio if the art ever changes.
         Keep it 8-bit PNG: the old 16-bit files failed to decode on some
         clients and showed a gray placeholder. -->
    <meta property="og:image" content="https://rizzy.today/share-card-red-1000.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1000">
    <meta property="og:image:height" content="1000">
