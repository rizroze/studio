      <h1>Riz Roze — End-to-End Creative Partner</h1>
      <p>Started in guerrilla marketing for rock bands. The job was leaving a mark. It still is.</p>
      <p>Studied engineering and film, tattooed, made clothes and walked runways. Ten years following the work wherever it went. Four of those in crypto, two as creative lead, including the campaigns for two hackathons run by Solana Mobile, the team building Solana's phone: Seeker and the $125K+ Monolith.</p>
      <p>Most teams build the product and forget the thing that makes anyone remember it. Now I take a brand from the first mark to launch day: the identity, the film that introduces it, and the site or app it lives in. Sometimes one launch, sometimes ongoing. Usually solo, usually fast.</p>
      <p>Everything here was designed, animated and built by me. One person to ask, one hand on all of it.</p>
      <h2>Selected work</h2>
      <ul>
        <li>Flash Trade — a self-initiated product launch film.</li>
        <li>Shaderweb — brand assets that run instead of sitting in a folder. Live shaders, liftable as embeds.</li>
        <li>Hydex, Logo Animation — logo animation for the Hydex mark, built to open decks and social posts.</li>
        <li>world. — a globe that collects what one word means to people. Spin it, type, drop a pin.</li>
        <li>Coinbase, redesigned — a redesign nobody asked for. It just felt like it should look this way.</li>
        <li>Solana Mobile, for Radiants — Solana Mobile's flagship event, $125K+ in prizes, 70+ pieces run end to end.</li>
      </ul>
      <p><a href="https://cal.com/rizzytoday/15min">Book 15 minutes</a></p>
